name: Compare shrinkage prior (temporary)

# Temporary, delete once there's a verdict (along with app.evaluate's
# SHRINK_TOWARD_JOINT_OVERRIDE support).
#
# Runs app.compare, which scores BOTH configurations on the same held-out
# matches and compares them per match, paired. That matters because the
# first A/B of this change came back at a 0.27% Brier gain in the Premier
# League and a smaller loss in the Championship -- differences far too
# small to call from two separate runs' summary numbers, and picking
# per-competition winners off numbers that size is how you overfit a
# backtest to its own test set.
#
# The output to read is the confidence interval on the mean per-match
# difference. If it spans zero, the change is not distinguishable from
# noise no matter which way the raw averages happened to fall.
#
# Read-only. Actions > "Compare shrinkage prior (temporary)" > Run workflow.
on:
  workflow_dispatch: {}

jobs:
  compare:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install model-service dependencies
        working-directory: model-service
        run: pip install -r requirements.txt

      - name: Paired comparison
        working-directory: model-service
        run: python -m app.compare
