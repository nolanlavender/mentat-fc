name: Diagnose matchday lineups

# Manual-only. Answers "the matchday check ran and the lineup still isn't
# showing" -- which the workflow's own log genuinely cannot, because its
# query skips any fixture that ALREADY has lineup rows. A fixture whose
# lineup landed successfully is invisible to the message you'd check.
#
# Separates the four states (see app.diagnose_lineups' docstring):
#   1. outside the +/-3h check window -- was never looked up
#   2. in the window, nothing published yet -- normal, try later
#   3. lineup captured, predictions predate it -- re-run Daily data refresh
#   4. lineup captured and applied -- problem is API/frontend, not data
#
# Read-only, writes nothing, safe against production any time.
#
# Actions > "Diagnose matchday lineups" > Run workflow. Optionally pass a
# team-name substring to narrow it down.
#
# Requires the DATABASE_URL secret the other workflows already use.
on:
  workflow_dispatch:
    inputs:
      team:
        description: 'Optional team-name substring to filter to (e.g. Arsenal)'
        required: false
        default: ''

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install model-service dependencies
        working-directory: model-service
        run: pip install -r requirements.txt

      - name: Diagnose lineups
        working-directory: model-service
        # Passed through env, NOT interpolated straight into the run: line --
        # `${{ inputs.team }}` inline would let a dispatch input inject shell
        # commands. Quoted "$TEAM" is inert; an empty value is handled as
        # "no filter" by diagnose_lineups itself.
        env:
          TEAM: ${{ inputs.team }}
        run: python -m app.diagnose_lineups "$TEAM"
