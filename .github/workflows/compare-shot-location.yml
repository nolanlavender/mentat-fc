name: Compare shot location (temporary)

# Temporary, delete once there's a verdict.
#
# The shot-location columns (inside vs outside the box) are now
# backfilled. This asks whether weighting shots by WHERE they were taken
# is a better fitting signal than counting shots on target -- they're
# alternatives, not complements, since both replace the goal count with a
# lower-noise proxy.
#
# Runs app.compare, which scores both configurations on the same held-out
# fixtures and compares them per match, paired, with a bootstrapped
# confidence interval. Read the INTERVAL, not the raw averages: the last
# change that looked like a win on aggregates turned out to sit inside
# the noise floor (~0.003 Brier at this test set's size).
#
# It also prints shot-location coverage first. If that's low, the blend is
# a partial no-op and the comparison is measuring less than it appears to.
#
# Read-only. Actions > "Compare shot location (temporary)" > Run workflow.
on:
  workflow_dispatch: {}

jobs:
  compare:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install model-service dependencies
        working-directory: model-service
        run: pip install -r requirements.txt
      - name: Paired comparison
        working-directory: model-service
        run: python -m app.compare
