name: Matchday lineup check

# Separate from daily-refresh.yml on purpose -- that one runs once a day
# and only ever looks at *finished* fixtures (backfillLineupsForCompetitionSeason).
# This one runs far more often, checking fixtures kicking off soon (or that
# kicked off recently but aren't finished yet) for a real, confirmed
# starting lineup -- typically announced by API-Football roughly an hour
# before kickoff. See seedTodaysLineups (backend/seed/sources/api-football.ts)
# for why that's a genuinely different check from the post-match backfill,
# not just a more-frequent version of it.
#
# Also reruns app.train right after the lineup check, so a newly-confirmed
# matchday squad actually reaches that fixture's own prediction the same
# hour it's announced -- not just at the next daily-refresh.yml cron.
# app.train makes zero external API calls (pure DB read/compute/write via
# app.dixon_coles.DixonColesModel.predict_with_availability and
# app.goal_scorer.compute_team_availability), so an hourly rerun costs
# nothing against the API-Football budget below -- it refits the same
# models daily-refresh.yml already fits on the same finished-match data,
# then, for each upcoming fixture, checks whether either side now has a
# confirmed squad (fixture_lineups) different enough from its usual
# reliable-share players to matter. Most hourly runs touch zero fixtures'
# predictions -- a confirmed lineup is typically only ~1 hour from
# kickoff, so most of the day this is a no-op refit. See
# docs/learning-log.md's entry on player-availability adjustments for the
# full design (rating-based compensation, why this reuses the existing
# hourly job instead of a new schedule) and docs/CLAUDE.md's player/
# injury/form-driven model note. The regular daily-refresh.yml retrain,
# once a day on finished results, is unaffected by this workflow.
#
# Hourly is comfortably inside budget -- confirmed via the account's
# api-sports.io dashboard, the plan is 7500 calls/day (see api-football.ts's
# DAILY_BUDGET), not the free tier's 100/day docs/CLAUDE.md originally
# described. A non-matchday run costs one cheap DB query and zero API
# calls, since the fixture-selection query only matches something kicking
# off in the next few hours.
#
# Requires the same three repository secrets as daily-refresh.yml
# (Settings > Secrets and variables > Actions): DATABASE_URL,
# API_FOOTBALL_KEY, JWT_SECRET.
on:
  schedule:
    - cron: '0 * * * *' # every hour, on the hour (see architecture.md's note on Actions cron delay tolerance)
  workflow_dispatch: {} # manual "Run workflow" button, for testing or catching up on demand

jobs:
  matchday-lineups:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Check for newly-confirmed starting lineups
        working-directory: backend
        run: npm run db:seed:matchday-lineups

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install model-service dependencies
        working-directory: model-service
        run: pip install -r requirements.txt

      - name: Refit and repredict, so a newly-confirmed lineup reaches its fixture's prediction this hour
        working-directory: model-service
        run: python -m app.train
