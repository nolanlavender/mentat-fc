name: Matchday lineup check

# Separate from daily-refresh.yml on purpose -- that one runs once a day
# and only ever looks at *finished* fixtures (backfillLineupsForCompetitionSeason).
# This one runs far more often, checking fixtures kicking off soon (or that
# kicked off recently but aren't finished yet) for a real, confirmed
# starting lineup -- typically announced by API-Football roughly an hour
# before kickoff. See seedTodaysLineups (backend/seed/sources/api-football.ts)
# for why that's a genuinely different check from the post-match backfill,
# not just a more-frequent version of it.
#
# Reruns the model after the lineup check, but ONLY when a lineup was
# actually newly confirmed, and only for the fixtures that have one
# (app.apply_lineups, not app.train). Restored 2026-08-21 after being
# reverted 2026-08-20; the history below is why the conditional and the
# narrower job both matter, and is kept rather than trimmed because the
# original reasoning was plausible and wrong in a way worth remembering.
#
# The reverted version ran app.train unconditionally, every hour
# (2026-08-19's player-availability PR). The reasoning at the time was
# "app.train makes
# zero external API calls, so an hourly rerun costs nothing" -- true, but
# the wrong thing to measure. It ignores that app.train refits three
# Dixon-Coles models
# AND rewrites a player_goal_predictions row per reliable player per
# upcoming fixture across all three competitions, via one
# upsert_player_goal_prediction call (one DB round trip) per row, not
# batched -- genuinely slow (tens of minutes), and fine to pay ONCE a
# day, but multiplying that by 24 (this job's actual hourly cadence) is
# not "free" just because it makes no external API calls. Within about a
# day of that change shipping, this job's own runs had ballooned from a
# few seconds to 46 minutes, then 1.5+ hours, and started failing outright
# with no runner ever assigned -- consistent with the account's GitHub
# Actions minutes running out from the cumulative overage, not a code bug
# in the job itself. Check Settings > Billing > Actions usage/spending
# limits before re-attempting anything on this schedule.
#
# That comment ended by naming what a safe version would need: "only
# recomputing predictions for fixtures whose confirmed lineup actually
# changed since the last check, instead of a full refit + full rewrite
# every single hour regardless." That is what now exists, in two parts:
#
#   1. The retrain step below is conditional on the lineup check having
#      actually confirmed something. Most hours confirm nothing and cost
#      one cheap DB query, exactly as before.
#   2. When it does run, it runs app.apply_lineups, which reuses
#      app.train's own prediction loop restricted to fixtures that have a
#      confirmed squad -- a handful, not the ~900 upcoming fixtures whose
#      predictions a lineup cannot possibly have changed. The model fits
#      still happen (a prediction needs fitted parameters); the ~77,000
#      unbatched upserts do not.
#
# The repository is also public now, so Actions minutes are free -- but
# that is deliberately NOT the reason this is back. Running twenty minutes
# of pointless work hourly was wrong when it was billed and is still wrong
# when it is not; it was fixed, not merely made affordable.
#
# Hourly is comfortably inside budget -- confirmed via the account's
# api-sports.io dashboard, the plan is 7500 calls/day (see api-football.ts's
# DAILY_BUDGET), not the free tier's 100/day docs/CLAUDE.md originally
# described. A non-matchday run costs one cheap DB query and zero API
# calls, since the fixture-selection query only matches something kicking
# off in the next few hours.
#
# Requires the same three repository secrets as daily-refresh.yml
# (Settings > Secrets and variables > Actions): DATABASE_URL,
# API_FOOTBALL_KEY, JWT_SECRET.
on:
  schedule:
    # Every 15 minutes, not hourly -- measured, not guessed. On 2026-08-22
    # app.diagnose_lineups reported the first four real pre-match captures
    # at a median lead of NINE MINUTES before kickoff, all four identical
    # because a single hourly run happened to catch them. The 11:00 cron
    # was delivered at 11:21 (GitHub's scheduled-workflow delay, routinely
    # 10-20 minutes under load), which left exactly one useful attempt for
    # an 11:30 kickoff. Ten more minutes of delay and every one of those
    # lineups would have been missed.
    #
    # Lineups publish around an hour before kickoff, so the window that
    # matters is roughly T-60 to T-0. Hourly sampling gets one shot at it
    # and sometimes none; every 15 minutes gets four, which is what turns
    # capture from luck into routine.
    #
    # Cost stays negligible: a run with nothing near kickoff is one cheap
    # DB query and zero API calls, and a fixture stops being checked the
    # moment its lineup lands (the query skips fixtures that already have
    # rows). Worst case is a handful of extra calls per fixture against a
    # 7500/day budget.
    - cron: '*/15 * * * *'
  workflow_dispatch: {} # manual "Run workflow" button, for testing or catching up on demand

jobs:
  matchday-lineups:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Check for newly-confirmed starting lineups
        id: lineups
        working-directory: backend
        run: npm run db:seed:matchday-lineups

      # Only when something was actually confirmed. This condition is the
      # entire difference between this job and the version that exhausted
      # the account's Actions minutes -- without it, every hour pays for a
      # retrain that has nothing new to apply.
      - uses: actions/setup-python@v5
        if: steps.lineups.outputs.announced != '0' && steps.lineups.outputs.announced != ''
        with:
          python-version: '3.12'
      - name: Install model-service dependencies
        if: steps.lineups.outputs.announced != '0' && steps.lineups.outputs.announced != ''
        working-directory: model-service
        run: pip install -r requirements.txt
      - name: Apply the confirmed lineups to those fixtures' predictions
        if: steps.lineups.outputs.announced != '0' && steps.lineups.outputs.announced != ''
        working-directory: model-service
        run: python -m app.apply_lineups
