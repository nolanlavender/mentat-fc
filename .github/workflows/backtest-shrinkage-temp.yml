name: Backtest SHRINKAGE (temporary)

# Temporary, throwaway workflow -- delete this file (and
# app.evaluate.SHRINKAGE's SHRINKAGE_OVERRIDE support, see its own
# comment) once a value has been chosen and promoted to app.train. Built
# specifically to let this get tested and decided from a phone, no
# laptop/local DATABASE_URL needed -- see docs/learning-log.md's
# 2026-08-20 entry for why SHRINKAGE exists (the West Ham Championship
# over-prediction bug) and app.evaluate.SHRINKAGE's own comment for what
# a good value should look like (barely moves established teams'
# attack/defense, visibly reins in sparse-data ones).
#
# Runs one job per candidate value via a matrix, all in parallel, each
# its own collapsible section in the run -- easier to compare on mobile
# than one long scrolled log. app.evaluate is read-only (no writes to
# the real DB), so running several at once against the same DATABASE_URL
# is safe.
#
# workflow_dispatch only -- never scheduled, run it by hand: Actions >
# "Backtest SHRINKAGE (temporary)" > Run workflow (works from the GitHub
# mobile app too -- tap the run once it's done to read each candidate's
# Brier/log-loss numbers).
#
# Requires the same DATABASE_URL secret the other workflows use
# (Settings > Secrets and variables > Actions).
on:
  workflow_dispatch:
    inputs:
      candidates:
        description: 'Comma-separated SHRINKAGE values to test'
        required: false
        default: '0.0,0.02,0.05,0.1,0.2,0.5'

jobs:
  candidates:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - id: matrix
        run: echo "value=$(echo '${{ github.event.inputs.candidates }}' | jq -R -c 'split(",")')" >> "$GITHUB_OUTPUT"

  backtest:
    needs: candidates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shrinkage: ${{ fromJson(needs.candidates.outputs.matrix) }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SHRINKAGE_OVERRIDE: ${{ matrix.shrinkage }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install model-service dependencies
        working-directory: model-service
        run: pip install -r requirements.txt

      - name: Backtest at SHRINKAGE=${{ matrix.shrinkage }}
        working-directory: model-service
        run: python -m app.evaluate
