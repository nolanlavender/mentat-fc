services:
  postgres:
    image: postgres:16-alpine
    container_name: mentat-fc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mentat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mentat_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-mentat_fc}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mentat}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
