# Render "Blueprint" -- lets you deploy the backend with one click (New +
# > Blueprint in the Render dashboard, point it at this repo) instead of
# manually filling in every field. No secrets live here: `sync: false`
# means Render prompts you to type each value in during setup instead of
# reading it from anywhere, so real credentials never touch the repo.
#
# startCommand runs migrations before starting the server on every deploy
# -- safe because node-pg-migrate tracks what's already been applied
# (pgmigrations table), so a deploy where nothing changed just no-ops that
# step. Render injects its own PORT env var at runtime, which
# backend/src/config/env.ts already reads (`process.env.PORT ?? 4000`), so
# nothing needs setting for that.
services:
  - type: web
    name: mentat-fc-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run migrate:up && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: API_FOOTBALL_KEY
        sync: false
    # No FPL_ENTRY_ID env var here -- removed 2026-08-18. Each user links
    # their own FPL team from the My Team page itself (users.fpl_entry_id),
    # not a server-wide config value. See docs/learning-log.md's 2026-08-18
    # entry.
